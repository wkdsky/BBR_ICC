# F-BBR OPIv2 trace-validation profile.
# Uses a larger (still queue-budget-limited) target so packetization remains
# identifiable in the repository's low-rate, high-RTT smoke scenario.
f_bbr.enable_opiv2 = true
f_bbr.legacy_spectral_path_enabled = false
f_bbr.probe_period_rtt_slots = 4,6,8,10,12
f_bbr.probe_code_length_cycles = 4
f_bbr.probe_target_amplitude_ratio = 0.05
f_bbr.probe_min_amplitude_ratio = 0.005
f_bbr.probe_max_amplitude_ratio = 0.15
f_bbr.probe_queue_budget_bdp = 0.10
f_bbr.warmup_cycles = 1
f_bbr.analysis_cycles = 4
f_bbr.min_valid_cycles = 3
f_bbr.phase_bins_per_cycle = 16
f_bbr.opiv3.adaptive_cruise_baseline_enabled = true
f_bbr.opiv3.persistent_across_cruises = true
f_bbr.opiv3.never_disable_on_unresolved = true
f_bbr.opiv3.analysis_cycles_per_window = 12
f_bbr.opiv3.min_valid_analysis_cycles = 6
f_bbr.opiv3.decision_stride_cycles = 2
f_bbr.opiv3.input_snr_min = 2.0
f_bbr.opiv3.phase_coverage_min = 0.75
f_bbr.opiv3.measurement_confidence_update_min = 0.45
f_bbr.trace_verbosity = 2
f_bbr.validation_shadow_windows = true
f_bbr.validation_shadow_analysis_cycles = 6
f_bbr.validation_shadow_stride_cycles = 1
f_bbr.validation_shadow_min_valid_cycles = 5
