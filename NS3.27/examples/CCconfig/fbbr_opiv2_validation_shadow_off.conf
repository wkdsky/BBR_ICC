# F-BBR OPIv2 validation profile with shadow analysis disabled for A/B only.
f_bbr.enable_opiv2 = true
f_bbr.legacy_spectral_path_enabled = false
f_bbr.probe_period_rtt_slots = 4,6,8,10
f_bbr.probe_code_length_cycles = 4
f_bbr.probe_target_amplitude_ratio = 0.05
f_bbr.probe_min_amplitude_ratio = 0.02
f_bbr.probe_max_amplitude_ratio = 0.10
f_bbr.probe_queue_budget_bdp = 0.20
f_bbr.warmup_cycles = 1
f_bbr.analysis_cycles = 4
f_bbr.min_valid_cycles = 3
f_bbr.phase_bins_per_cycle = 16
f_bbr.opiv3.adaptive_cruise_baseline_enabled = true
f_bbr.trace_verbosity = 2
f_bbr.validation_shadow_windows = false
f_bbr.validation_shadow_analysis_cycles = 6
f_bbr.validation_shadow_stride_cycles = 1
f_bbr.validation_shadow_min_valid_cycles = 5
