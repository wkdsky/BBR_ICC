# -----------------------------------------------------------------------------
# F-BBR legacy spectral A/B 参数（仅在 enable_F-BBR frequency search=false 时）
# -----------------------------------------------------------------------------

# 调制频率（Hz）。合法范围：(0.0, +inf)。三角波周期 = 1 / freq_hz。
# 经验范围：2.0–10.0 Hz；典型值 5.0 Hz（≈200 ms 周期，可在一秒 cruise 内拿到 5 个完整周期）。
# 过高（>20 Hz）会让单 cruise 周期远小于 RTT、相干性丢失；过低（<1 Hz）会让频域分辨率不够。
default_modulation_freq_hz = 5.0

# 振幅模式。候选：
#   kFixed | "fixed"           ：固定 Mbps 振幅（=default_fixed_amplitude_mbps）
#   kMiu2  | "2miu" | "miu2"  ：max_bw / 2
#   kMiu3  | "3miu" | "miu3"  ：max_bw / 3
#   kMiu4  | "4miu" | "miu4"  ：max_bw / 4
#   kMiu8  | "8miu" | "miu8"  ：max_bw / 8
#   kSR2   | "2sr"  | "sr2"   ：sending_rate / 2
#   kSR3   | "3sr"  | "sr3"   ：sending_rate / 3
#   kSR4   | "4sr"  | "sr4"   ：sending_rate / 4   ← 当前默认
#   kSR8   | "8sr"  | "sr8"   ：sending_rate / 8
#   kSR12  | "12sr" | "sr12"  ：sending_rate / 12
#   kSR16  | "16sr" | "sr16"  ：sending_rate / 16
#   "0" 或 ""                 ：fallback 到 default_fixed_amplitude_mbps
#   "<数字>"（如 "25"）        ：当作 Mbps，解析成 kFixed（数值 * 1e6 bps）
default_amplitude_mode = 4miu

# kFixed 模式下的振幅大小（Mbps）。合法范围：(0.0, +inf)。
# 经验范围：1.0–100.0 Mbps；典型 10 Mbps。在 100 Mbps 瓶颈下约占链路 10%。
default_fixed_amplitude_mbps = 10.0

# -----------------------------------------------------------------------------
# 每流覆盖（可选；缺省则用上面的 default_*）
# -----------------------------------------------------------------------------

# 单流调制频率覆盖。同合法范围。
flow.0.modulation_freq_hz = 5.0
flow.1.modulation_freq_hz = 5.0
flow.2.modulation_freq_hz = 5.0
flow.3.modulation_freq_hz = 5.0

# 单流振幅覆盖（kFixed 模式生效）。同合法范围。
flow.0.fixed_amplitude_mbps = 50.0
flow.1.fixed_amplitude_mbps = 50.0
flow.2.fixed_amplitude_mbps = 50.0
flow.3.fixed_amplitude_mbps = 50.0

# -----------------------------------------------------------------------------
# 收敛状态门控
# -----------------------------------------------------------------------------

# 单轮稳定性退出门限（相对变化）。合法范围：[0.0, 1.0]。
# 单轮 max_bw / srtt 相对变化低于此值，记为"本轮稳定"。
# 越小越敏感（更快判稳）；越大越宽松（更晚判稳）。典型 0.15–0.30。
stability.single_round_exit_threshold = 0.25

# 连续两轮稳定退出门限（同上含义）。合法范围：[0.0, 1.0]。
# 通常略低于 single_round，用于"两轮连稳"的硬确认。
stability.consecutive_exit_threshold = 0.15

# 累计稳定轮数阈值。合法范围：[1, +inf)，整数。
# 代码侧 clamp 到 max(1, value)；实际有效范围 1–10。
# 越小越激进；越大越保守（更多轮证据）。典型 2–5。
stability.stable_rounds = 3

# 全管道增长判定阈值（倍数）。合法范围：[1.0, +inf)。
# detected_bw / recent_min ≥ 此值时，认为管道还没填满，禁用 freq 工具。
stability.full_pipe_growth_threshold = 1.25

# -----------------------------------------------------------------------------
# Delivery Rate 与 SRTT 独立频域完整性门限。
# 窗口必须同时通过两个门限；联合分数严格取两者最小值。
# -----------------------------------------------------------------------------

# DRATE 频域完整性最低分。合法范围：[0.0, 1.0]。
# 越大越严苛；典型 0.20–0.40。低于此分窗口被判"DRATE 不健康"。
spectral.drate_integrity_threshold = 0.25

# SRTT 频域完整性最低分。合法范围：[0.0, 1.0]。
spectral.srtt_integrity_threshold = 0.25

# DRATE 最低 SNR。合法范围：[0.0, +inf)。
# 典型 1.0–3.0；低于此值信噪比不足，窗口被拒。
spectral.min_drate_snr = 1.5

# SRTT 最低 SNR。合法范围：[0.0, +inf)。
spectral.min_srtt_snr = 1.5

# DRATE 频域峰宽度允许倍数（相对 cfg sigma）。合法范围：[0.0, +inf)。
# 越大越宽松。>2.0 视为谱峰过宽（drate_peak_broad 失效原因之一）。
spectral.max_drate_width_ratio = 2.0

# SRTT 频域峰宽度允许倍数。同上。
spectral.max_srtt_width_ratio = 2.5

# DRATE 最低相位相干性。合法范围：[0.0, 1.0]，代码 Clamp01。
# 越接近 1 越要求多次测量相位一致。
spectral.min_drate_phase_coherence = 0.5

# SRTT 最低相位相干性。合法范围：[0.0, 1.0]，代码 Clamp01。
spectral.min_srtt_phase_coherence = 0.5

# 频域 sigma 比例（用于 width 评分）。合法范围：[0.0, +inf)。
# 越小越严苛。
spectral.freq_sigma_ratio = 0.08

# SNR 评分斜率（用于把 SNR 映射到 [0,1]）。合法范围：[0.0, +inf)。
# score = clamp01((snr - min_snr) * snr_slope)；越大越快达到满分。
spectral.snr_slope = 2.0

# 能量阈值（band 内能量归一化下界）。合法范围：[0.0, 1.0]，代码 Clamp01。
# 越接近 0 越宽松；典型 0.05–0.20。
spectral.energy_threshold = 0.10

# 能量评分斜率。合法范围：[0.0, +inf)。
# 越大越快达到能量满分；典型 10–30。
spectral.energy_slope = 20.0

# DRATE 频宽评分 r0（低于此宽度视为窄带满分）。合法范围：[0.0, +inf)。
spectral.width_r0_drate = 1.5

# SRTT 频宽评分 r0。同上。
spectral.width_r0_srtt = 2.0

# 频宽评分 sigma（高斯下降速度）。合法范围：[0.0, +inf)。
# 越大下降越快，越严苛。
spectral.width_sigma = 0.8

# -----------------------------------------------------------------------------
# NORMAL 无合格窗口时可尝试扩大窗口；MERGED 仍须通过双信号门控。
# -----------------------------------------------------------------------------

# 是否启用 merged_rescue 救援。候选：true | false。
merged_rescue.enable = true

# merged 救援时的窗口放大倍数。合法范围：[1.0, +inf)。
# 越大救援窗口越长，置信度越低。典型 1.5–3.0。
merged_rescue.window_multiplier = 2.0

# merged 救援的最大重试轮数。合法范围：[0, 1]，整数。
# 代码 clamp 到 min(1, value)；只能填 0 或 1，1=允许一次救援，0=禁用救援。
merged_rescue.max_passes = 1

# merged 救援的窗口趋势比上限（线性趋势 / 窗口均值）。合法范围：[0.0, +inf)。
# 越大越宽松；典型 0.10–0.30。
merged_rescue.max_trend_ratio = 0.20

# merged 救援成功后对 selected bw 的置信度折扣。合法范围：[0.0, 1.0]，代码 Clamp01。
# 越接近 1 越接近 normal 窗口的置信度；典型 0.7–0.9。
merged_rescue.confidence_discount = 0.8

# -----------------------------------------------------------------------------
# 进入新 CRUISE 时关闭上一轮 TrustedBw 的控制应用窗口。
# -----------------------------------------------------------------------------

# 是否在新 cruise 起点清空 trusted_bw 状态。候选：true | false。
trusted_bw.clear_on_cruise_start = true

# -----------------------------------------------------------------------------
# Trace
# -----------------------------------------------------------------------------

# 频域门控 trace 模式。候选（由 ParseFBBRGateTraceMode 解析）：
#   "off"            → FBBRGateTraceMode::kOff
#   "round_only"     → FBBRGateTraceMode::kRoundOnly
#   "sampled_pacing" → FBBRGateTraceMode::kSampledPacing
#   "full"           → FBBRGateTraceMode::kFull
#   其他任意值        → fallback 到 kRoundOnly
trace.gate_trace_mode = round_only

# sampled_pacing 模式的采样间隔（微秒）。合法范围：[1, +inf)，整数。
# 代码 clamp 到 max(1, value)；1us = 1MHz 采样（最大开销），10000us = 100Hz 采样（默认）。
trace.gate_trace_sample_interval_us = 10000

# 是否输出 cruise 窗口明细 trace（每次扫窗事件一行）。
# 候选：true | false。
trace.enable_cruise_window_trace = true

# 是否输出 trusted_bw 选择过程 trace。候选：true | false。
trace.enable_trusted_bw_selection_trace = true
