# ============================================================
# FreqBBR 默认配置文件
# 路径: /home/wkd/BBR_ICC/NS3.27/examples/freqBBR/freqbbr_default.conf
# 格式: key = value
# 说明: 命令行参数优先级高于本文件。
# ============================================================

# =========================
# 1. 发送端频域调制参数
# =========================

# 默认调制频率 f_m，单位 Hz。
# 发送速率在 CRUISE 阶段按固定频率 f_m 注入三角波扰动：
# R_send(t) = R_base * scale + A_eff * tri(2π f_m t)
default_modulation_freq_hz = 5.0

# 默认调制幅度模式。
# fixed_mbps: 使用固定 Mbps 作为三角波幅度；
# miu2 / 2miu: 使用 BBRv2 MaxBw 的 1/2 作为幅度；
# miu3 / 3miu: 使用 BBRv2 MaxBw 的 1/3 作为幅度；
# miu4 / 4miu: 使用 BBRv2 MaxBw 的 1/4 作为幅度；
# miu8 / 8miu: 使用 BBRv2 MaxBw 的 1/8 作为幅度；
# sr2 / 2sr: 使用 base pacing rate 的 1/2 作为幅度；
# sr3 / 3sr: 使用 base pacing rate 的 1/3 作为幅度；
# sr4 / 4sr: 使用 base pacing rate 的 1/4 作为幅度；
# sr8 / 8sr: 使用 base pacing rate 的 1/8 作为幅度；
# sr12 / 12sr: 使用 base pacing rate 的 1/12 作为幅度；
# sr16 / 16sr: 使用 base pacing rate 的 1/16 作为幅度。
default_amplitude_mode = fixed_mbps

# 固定幅度，单位 Mbps。
# 当 amplitude_mode=fixed_mbps 时：
# A_eff = fixed_amplitude_mbps * 1e6 * scale
default_fixed_amplitude_mbps = 50.0

# 每条流可单独配置调制频率。
# 未指定的流使用 default_modulation_freq_hz。
flow.0.modulation_freq_hz = 5.0
flow.1.modulation_freq_hz = 5.0
flow.2.modulation_freq_hz = 5.0
flow.3.modulation_freq_hz = 5.0

# 每条流可单独配置固定幅度，单位 Mbps。
flow.0.fixed_amplitude_mbps = 50.0
flow.1.fixed_amplitude_mbps = 50.0
flow.2.fixed_amplitude_mbps = 50.0
flow.3.fixed_amplitude_mbps = 50.0

# =========================
# 2. EffectiveBw Selection 中的 MaxStable 判断参数
# =========================

# 单轮 MaxDRate 波动阈值。
# V = |D_i - D_{i-1}| / D_{i-1}
# 若 V > threshold，则判断 MaxStable=false，下一轮 CRUISE 进入频域调制。
stability.single_round_exit_threshold = 0.25

# 连续两轮波动阈值。
# 若 V_i > threshold 且 V_{i-1} > threshold，则 MaxStable=false。
stability.consecutive_exit_threshold = 0.15

# 重新收敛所需轮数。
# stable_cnt >= 3 时：w_freq=0，MaxStable=true，关闭频域调制。
stability.stable_rounds = 3

# 重新收敛增长阈值。
# 若 D_i >= 1.25 * D_ref，则 delivery rate 仍明显增长，stable_cnt 清零。
stability.full_pipe_growth_threshold = 1.25

# =========================
# 3. Spectral Validity Gate V2 参数
# =========================

# 最小频域有效性分数。
# spectral_validity_score = sqrt(Q_drate * Q_srtt)
spectral.min_validity = 0.25

# 最小 DRate 主峰信噪比。
# SNR_D = A_D(f_m) / noise_floor_D
spectral.min_drate_snr = 1.5

# 最小 SRTT 主峰信噪比。
# SNR_R = A_R(f_m) / noise_floor_R
spectral.min_srtt_snr = 1.5

# 最大 DRate 主峰宽度比例。
# width_ratio_D = width_D / max(width_SRate, Δf)
spectral.max_drate_width_ratio = 2.0

# 最大 SRTT 主峰宽度比例。
spectral.max_srtt_width_ratio = 2.5

# 最小 DRate 周期间相位相干性。
# phase_coherence = |Σ C_k| / (Σ |C_k| + ε)
spectral.min_drate_phase_coherence = 0.5

# 最小 SRTT 周期间相位相干性。
spectral.min_srtt_phase_coherence = 0.5

# 频率指数评分比例项。
# sigma_f = max(freq_sigma_ratio * f_m, 0.5 / window_duration)
spectral.freq_sigma_ratio = 0.08

# SNR logistic 斜率。
# Q_snr = 1 / (1 + exp(-slope * (SNR - threshold)))
spectral.snr_slope = 2.0

# 目标频带能量集中度阈值。
# Q_energy = logistic(band_energy_rel, threshold, slope)
spectral.energy_threshold = 0.10

# 能量集中度 logistic 斜率。
spectral.energy_slope = 20.0

# DRate 主峰宽度评分 r0。
# excess=max(0,width_ratio-r0)
# Q_width=exp(-0.5*(excess/sigma)^2)
spectral.width_r0_drate = 1.5

# SRTT 主峰宽度评分 r0。
spectral.width_r0_srtt = 2.0

# 主峰宽度评分 sigma。
spectral.width_sigma = 0.8

# =========================
# 4. Merged-window Rescue 参数
# =========================

# 是否开启 merged-window rescue。
merged_rescue.enable = true

# 合并窗口倍数。
# W_merge = [start(W_i), min(start(W_i)+multiplier*T, cruise_end)]
merged_rescue.window_multiplier = 2.0

# 最大合并轮数。为了时效性，只允许 1。
merged_rescue.max_passes = 1

# merged window 前后半 DRate 中位数漂移阈值。
# trend = |median(first)-median(second)| / median(all)
merged_rescue.max_trend_ratio = 0.20

# merged window 置信度折扣。
# trusted_bw_conf = discount * full_load_quality_v2
merged_rescue.confidence_discount = 0.8

# =========================
# 5. Robust Median Guard 参数
# =========================

# 是否开启鲁棒中位数兜底。
median_guard.enable = true

# 最小 DRate 样本数量。
median_guard.min_samples = 16

# 最大 IQR 比例。
# iqr_ratio = IQR(DRate) / median(DRate)
median_guard.max_iqr_ratio = 0.35

# 最大前后半漂移比例。
median_guard.max_trend_ratio = 0.20

# 中位数安全余量。
# GuardBw = min(NativeBw, median(DRate)*(1+margin))
median_guard.margin = 0.05

# guard 下修 scale 下界。
median_guard.scale_min = 0.85

# guard scale 上界，必须 <=1，避免无频域证据时上调。
median_guard.scale_max = 1.0

# guard 权重系数。
# guard_weight = alpha * w_freq
median_guard.weight_alpha = 0.30

# =========================
# 6. EffectiveBw 计算参数
# =========================

# TrustedBw 缩放模式。
# current: 双向缩放；
# downward_only: 只下修；
# asymmetric: 下修完整保留，上调乘 up_beta；
# high_conf_only: 只在高置信时启用；
# early_episode_only: 只在 stable_cnt<=1 启用。
effective_bw.scale_mode = asymmetric

# 非对称上调系数。
# raw_scale>1 时：scale=1+up_beta*(raw_scale-1)
effective_bw.up_beta = 0.25

# NORMAL/MERGED spectral source 的 scale 下界。
effective_bw.scale_min = 0.75

# NORMAL/MERGED spectral source 的 scale 上界。
effective_bw.scale_max = 1.05

# high_conf_only 模式的置信度阈值。
effective_bw.high_conf_threshold = 0.8

# =========================
# EffectiveBw 应用阶段参数
# =========================

# 是否启用 phase-specific EffectiveBw application。
# true: EffectiveBw 只应用于 REFILL/UP/DOWN；
# false: 不使用 EffectiveBw scale。
effective_bw.phase_specific_application = true

# CRUISE 是否强制使用 NativeBw 作为观测基线。
# 必须为 true，避免上一轮 EffectiveBw 污染本轮频域观测。
# CRUISE pacing = NativePacing + amplitude_bps_eff * triangle_wave。
effective_bw.cruise_uses_native_bw = true

# 如果本轮 CRUISE 没有生成新的 EffectiveBw，是否允许沿用上一轮 EffectiveBw。
# 默认 false。若为 false，则 REFILL/UP/DOWN 回退 NativeBw。
effective_bw.allow_stale_effective_bw = false

# EffectiveBw 是否允许应用到 REFILL。
# REFILL: final_pacing = native_pacing * clamp(EffectiveBw / NativeBw)。
effective_bw.apply_to_refill = true

# EffectiveBw 是否允许应用到 UP。
# UP: native_pacing 已包含 BBRv2 UP gain，只额外乘 EffectiveBw scale 一次。
effective_bw.apply_to_up = true

# EffectiveBw 是否允许应用到 DOWN。
# DOWN: native_pacing 已包含 BBRv2 DOWN gain，只额外乘 EffectiveBw scale 一次。
effective_bw.apply_to_down = true

# EffectiveBw 是否允许应用到 CRUISE。
# 必须默认为 false，CRUISE 不使用上一轮 EffectiveBw 作为基线。
effective_bw.apply_to_cruise = false

# 进入下一轮 CRUISE 时是否清除 EffectiveBw application。
# 必须默认为 true。
effective_bw.clear_on_cruise_start = true

# stable closure 后是否清除 TrustedBw / EffectiveBw。
# 必须默认为 true。
effective_bw.clear_on_stable_closure = true

# =========================
# 7. Trace 参数
# =========================

# gate trace 模式：off / round_only / sampled_pacing / full
trace.gate_trace_mode = round_only

# sampled_pacing 模式采样间隔，单位 us。
trace.gate_trace_sample_interval_us = 10000

# 是否输出 cruise full-load window 详细 trace。
trace.enable_cruise_window_trace = true

# 是否输出 EffectiveBw Selection 诊断。
trace.enable_effective_bw_selection_trace = true
